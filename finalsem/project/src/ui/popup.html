<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Summarizer</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header class="bar">
    <span class="wordmark">Page Summarizer</span>
    <span class="edition">Version 2 &middot; on this computer</span>
  </header>

  <main>
    <p id="page-title" class="page-title" hidden></p>

    <button id="summarize" type="button" class="go">Summarize this page</button>

    <p id="model-line" class="modelline" aria-live="polite">Checking this computer...</p>
    <p id="gpu-note" class="notice" hidden></p>

    <section id="progress" class="progress" hidden aria-live="polite">
      <p id="progress-text" class="progress-text"></p>
      <progress id="progress-bar" max="100" value="0"></progress>
      <p id="notice" class="notice" hidden></p>
    </section>

    <section id="error" class="error" hidden role="alert">
      <p id="error-text"></p>
      <p id="error-detail" class="detail" hidden></p>
    </section>

    <details id="settings" class="settings">
      <summary>Settings</summary>
      <label for="quality">Quality</label>
      <select id="quality">
        <option value="better">Better: Llama 3.2 1B (more accurate, slower)</option>
        <option value="fast">Fast: SmolLM2 360M (quicker, may get facts wrong)</option>
      </select>
    </details>

    <section id="result" class="result" hidden>
      <p id="result-notice" class="notice" hidden></p>
      <p id="condense-notice" class="notice" hidden></p>
      <button id="read-all" type="button" class="textbtn read-all" hidden>Read the whole page (slower)</button>
      <div id="summary" class="summary"></div>
      <p id="stats" class="stats"></p>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="'Segoe UI', Arial, sans-serif" fill="#1C1B1A"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C1B1A"/></marker></defs><rect x="0" y="0" width="1600" height="900" fill="#ffffff"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1C1B1A" text-anchor="start" data-fit="1520">V17  Built-in graphics read slowly, so a long page is shortened first</text>
<line x1="40" y1="68" x2="1560" y2="68" stroke="#D9D2C3" stroke-width="2"/>
<rect x="80" y="110" width="700" height="130" rx="4" ry="4" fill="#FBF0D9" stroke="#8A5A00" stroke-width="2.2"/>
<text x="430" y="149.95999999999998" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="668">Intel built-in graphics (the client's chip)</text>
<text x="430" y="185.2" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="668">Iris Xe in a Core i7-1355U. Reads 15.6 and writes 2 tokens a</text>
<text x="430" y="214.23999999999998" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="668">second with Llama 3.2 1B (developer laptop, Intel Gen-12).</text>
<rect x="820" y="110" width="700" height="130" rx="4" ry="4" fill="#FBF8F1" stroke="#B4391F" stroke-width="2.2"/>
<text x="1170" y="149.95999999999998" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="668">NVIDIA RTX 3050 (developer laptop only)</text>
<text x="1170" y="185.2" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="668">Reads about 600 and writes 34 to 53 tokens a second with</text>
<text x="1170" y="214.23999999999998" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="668">Llama 3.2 1B.</text>
<rect x="80" y="280" width="700" height="110" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="430" y="324.48" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="668">Wikipedia &quot;Lighthouse&quot; page, whole page</text>
<text x="430" y="359.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="668">SmolLM2 360M, 7 parts: 616.4 s (before 26 October).</text>
<rect x="820" y="280" width="700" height="110" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="1170" y="324.48" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="668">Same page, whole page, NVIDIA</text>
<text x="1170" y="359.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="668">Llama 3.2 1B, 7 parts: 74.1 s.</text>
<rect x="80" y="430" width="1440" height="290" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="800" y="520.92" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="1408">What the extension does on built-in graphics: 124.6 s for the same page</text>
<text x="800" y="556.16" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1408">1. Cuts the Notes and Bibliography and the [12] markers: 8,788 of 36,752 characters.</text>
<text x="800" y="585.1999999999999" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1408">2. Keeps the opening and the first sentences of the paragraphs: 5,968 characters (21 percent), one part, no merge request.</text>
<text x="800" y="614.2399999999999" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1408">3. Keeps answers short (3 sentences) and keeps the accurate main model, Llama 3.2 1B.</text>
<text x="800" y="643.2799999999999" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1408">4. Says what it did in the popup, and offers &quot;Read the whole page (slower)&quot;: about 12 minutes for this page.</text>
<rect x="80" y="760" width="1440" height="100" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="800" y="799.48" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="1408">Laptops with two chips</text>
<text x="800" y="834.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1408">Windows Graphics setting or setup.bat --gpu (opt-in) moves Chrome to the separate card. Nothing to do on the client's laptop.</text></svg>

<text x="1024.8246153846153" y="628" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="535.1753846153847">200.6 s</text>
<text x="40" y="786" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Tokens a second: the decode speed of each job's last request, as the extension records it (rounded).</text>
<text x="40" y="820" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Intel &quot;now&quot; = Llama 3.2 1B (about 695 MB) with long pages shortened (26 October). &quot;Before&quot; = SmolLM2 360M chosen automatically.</text>
<text x="40" y="854" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">The NVIDIA runs used the same Llama 3.2 1B, reading the whole page. All runs: hidden Chromium on the developer laptop.</text>
<text x="40" y="888" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Not measured on the client laptop (Intel Iris Xe, a faster variant of this Intel chip at 15 watts).</text>
<text x="40" y="922" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Left out: runs done while other programs were using the processor (see their notes in the test-run files).</text></svg>

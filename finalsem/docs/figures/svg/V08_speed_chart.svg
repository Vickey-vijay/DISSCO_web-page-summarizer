<text x="1200" y="503.72" font-size="22" font-weight="400" fill="#6B665C" text-anchor="middle" data-fit="688">Not measured: no short-article run on Intel with the model stored</text>
<text x="40" y="706" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Tokens a second: the decode speed of each job's last request, as the extension records it (rounded, as in the Markdown tables).</text>
<text x="40" y="740" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">The Intel runs used SmolLM2 360M (about 204 MB), which the extension picks on integrated graphics.</text>
<text x="40" y="774" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">The NVIDIA runs used Llama 3.2 1B (about 695 MB). The two chips therefore ran different models.</text>
<text x="40" y="808" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">The dashed bar is from the DEVLOG speed test (21 Oct), not a saved run file: the only Intel figure for the same model.</text>
<text x="40" y="842" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Left out: the three runs done while other programs were using the processor (see their notes in the test-run files).</text></svg>

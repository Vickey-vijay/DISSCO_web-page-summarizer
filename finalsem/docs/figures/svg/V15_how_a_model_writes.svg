<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="790" viewBox="0 0 1600 790" font-family="'Segoe UI', Arial, sans-serif" fill="#1C1B1A"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C1B1A"/></marker></defs><rect x="0" y="0" width="1600" height="790" fill="#ffffff"/><text x="40" y="50" font-size="26" font-weight="700" fill="#1C1B1A" text-anchor="start" data-fit="1520">V15  How the model writes: it reads the whole prompt, then writes one token at a time</text>
<line x1="40" y1="68" x2="1560" y2="68" stroke="#D9D2C3" stroke-width="2"/>
<rect x="40" y="110" width="270" height="200" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="175" y="155.92" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="238">Page text</text>
<text x="175" y="191.16" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">Up to 6,000</text>
<text x="175" y="220.2" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">characters per part</text>
<text x="175" y="249.23999999999998" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">(about 1,500 tokens,</text>
<text x="175" y="278.28" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">config.js)</text>
<path d="M310,210 L342,210" fill="none" stroke="#1C1B1A" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="342" y="110" width="270" height="200" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="477" y="155.92" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="238">Prompt</text>
<text x="477" y="191.16" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">One safety line, the</text>
<text x="477" y="220.2" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">title, the text between</text>
<text x="477" y="249.23999999999998" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">markers, one</text>
<text x="477" y="278.28" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">instruction</text>
<path d="M612,210 L644,210" fill="none" stroke="#1C1B1A" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="644" y="110" width="270" height="200" rx="4" ry="4" fill="#FBF8F1" stroke="#B4391F" stroke-width="2.2"/>
<text x="779" y="170.44" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="238">Reading (prefill)</text>
<text x="779" y="205.68" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">The model reads</text>
<text x="779" y="234.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">every token of the</text>
<text x="779" y="263.76" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">prompt in one pass</text>
<path d="M914,210 L946,210" fill="none" stroke="#1C1B1A" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="946" y="110" width="270" height="200" rx="4" ry="4" fill="#FBF0D9" stroke="#8A5A00" stroke-width="2.2"/>
<text x="1081" y="170.44" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="238">Writing (decode)</text>
<text x="1081" y="205.68" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">One new token per</text>
<text x="1081" y="234.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">step; each step uses</text>
<text x="1081" y="263.76" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">everything before it</text>
<path d="M1216,210 L1248,210" fill="none" stroke="#1C1B1A" stroke-width="2.4" marker-end="url(#ah)"/>
<rect x="1248" y="110" width="270" height="200" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="1383" y="155.92" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="238">Summary</text>
<text x="1383" y="191.16" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">Stops at the end of</text>
<text x="1383" y="220.2" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">the answer, or at 300</text>
<text x="1383" y="249.23999999999998" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">tokens a part, 320 for</text>
<text x="1383" y="278.28" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="238">the final</text>
<text x="40" y="350" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">Writing: one token at a time. Each small square is one step of the model.</text>

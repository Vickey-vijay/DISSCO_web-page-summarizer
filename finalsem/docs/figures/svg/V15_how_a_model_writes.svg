<text x="40" y="436" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="1520">The answer ends at its last token, or at the limit (300 tokens a part, 320 for the final summary).</text>
<rect x="40" y="470" width="1520" height="270" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="800" y="550.92" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="1488">Measured on this laptop (NVIDIA RTX 3050, Llama 3.2 1B)</text>
<text x="800" y="586.16" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1488">Saved clean runs, writing: 34 to 53 tokens a second. Each value is the last request of its job (v2-local-nvidia-cold-first-attempt.md; 40 and 42</text>
<text x="800" y="615.1999999999999" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1488">offline in v2-local-nvidia-offline.md).</text>
<text x="800" y="644.2399999999999" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1488">DEVLOG speed test, 21 Oct (no saved run file): about 63 tokens a second writing, and about 600 a second reading the prompt.</text>
<text x="800" y="673.2799999999999" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="middle" data-fit="1488">First answer: about 30 s of warm-up on first use while the graphics programs are compiled; 0.5 s in the later offline run.</text></svg>

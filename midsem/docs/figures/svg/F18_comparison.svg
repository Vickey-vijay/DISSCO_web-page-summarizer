<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990" font-family="'Segoe UI', Arial, sans-serif" fill="#1C1B1A"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C1B1A"/></marker></defs><rect x="0" y="0" width="1600" height="990" fill="#ffffff"/><rect x="40" y="100" width="240" height="60" rx="4" ry="4" fill="#FBF8F1" stroke="#B4391F" stroke-width="2.2"/>
<text x="160" y="136.72" font-size="24" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">Aspect</text>
<rect x="300" y="100" width="480" height="60" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="540" y="136.72" font-size="24" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="448">Copilot-style assistant</text>
<rect x="800" y="100" width="760" height="60" rx="4" ry="4" fill="#FBF8F1" stroke="#B4391F" stroke-width="2.2"/>
<text x="1180" y="136.72" font-size="24" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="728">This extension</text>
<rect x="40" y="180" width="240" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="160" y="247" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">Cost</text>
<rect x="300" y="180" width="480" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="316" y="245.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="448">Cloud service tied to a vendor account</text>
<rect x="800" y="180" width="760" height="56" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="816" y="213.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="728">Runs on a free-tier API key</text>
<rect x="800" y="244" width="760" height="56" rx="4" ry="4" fill="none" stroke="#6B665C" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="816" y="277.72" font-size="22" font-weight="400" fill="#6B665C" text-anchor="start" data-fit="728">Planned (V2): No key and no per-use cost</text>
<rect x="40" y="310" width="240" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="160" y="361" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">Data and</text>
<text x="160" y="393" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">privacy</text>
<rect x="300" y="310" width="480" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="316" y="375.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="448">Page text is sent to the vendor's cloud</text>
<rect x="800" y="310" width="760" height="56" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="816" y="343.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="728">Page text is sent to the Gemini cloud</text>
<rect x="800" y="374" width="760" height="56" rx="4" ry="4" fill="none" stroke="#6B665C" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="816" y="407.72" font-size="22" font-weight="400" fill="#6B665C" text-anchor="start" data-fit="728">Planned (V2): Page text stays on the user's machine</text>
<rect x="40" y="440" width="240" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="160" y="507" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">Offline use</text>
<rect x="300" y="440" width="480" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="316" y="505.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="448">Not possible</text>
<rect x="800" y="440" width="760" height="56" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="816" y="473.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="728">Needs the network for every summary</text>
<rect x="800" y="504" width="760" height="56" rx="4" ry="4" fill="none" stroke="#6B665C" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="816" y="537.72" font-size="22" font-weight="400" fill="#6B665C" text-anchor="start" data-fit="728">Planned (V2): Works offline once the model is cached</text>
<rect x="40" y="570" width="240" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="160" y="637" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">Control</text>
<rect x="300" y="570" width="480" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="316" y="635.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="448">Fixed vendor model and behavior</text>
<rect x="800" y="570" width="760" height="120" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="816" y="635.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="728">Model, chunk size and prompt chosen for this job</text>
<rect x="40" y="700" width="240" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="160" y="767" font-size="25" font-weight="700" fill="#1C1B1A" text-anchor="middle" data-fit="208">Research value</text>
<rect x="300" y="700" width="480" height="120" rx="4" ry="4" fill="#F3EEE2" stroke="#D9D2C3" stroke-width="2.2"/>
<text x="316" y="765.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="448">None for the project</text>
<rect x="800" y="700" width="760" height="56" rx="4" ry="4" fill="#EEF2E3" stroke="#3F5F2A" stroke-width="2.2"/>
<text x="816" y="733.72" font-size="22" font-weight="400" fill="#1C1B1A" text-anchor="start" data-fit="728">Cloud (V1) can be compared on speed, quality, memory</text>
<rect x="800" y="764" width="760" height="56" rx="4" ry="4" fill="none" stroke="#6B665C" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="816" y="797.72" font-size="22" font-weight="400" fill="#6B665C" text-anchor="start" data-fit="728">Planned (V2): Local engine joins the comparison</text>
<rect x="40" y="850" width="1520" height="120" rx="4" ry="4" fill="none" stroke="#6B665C" stroke-width="2.2" stroke-dasharray="9 6"/>
<text x="800" y="884.96" font-size="25" font-weight="700" fill="#6B665C" text-anchor="middle" data-fit="1488">Limitation (planned V2 model, from the PRD)</text>
<text x="800" y="920.2" font-size="22" font-weight="400" fill="#6B665C" text-anchor="middle" data-fit="1488">Local models of about 1B to 3B parameters summarize less well than cloud models. The first download is large, and V2 needs a WebGPU</text>
<text x="800" y="949.24" font-size="22" font-weight="400" fill="#6B665C" text-anchor="middle" data-fit="1488">browser with enough GPU memory.</text></svg>

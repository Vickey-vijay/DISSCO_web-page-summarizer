<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Summarizer</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="popup">
  <header>
    <h1>Page Summarizer</h1>
    <a id="open-options" href="#" class="link">Options</a>
  </header>

  <main>
    <p id="page-title" class="page-title" hidden></p>

    <button id="summarize" type="button" class="primary">Summarize this page</button>

    <section id="progress" class="progress" hidden aria-live="polite">
      <p id="progress-text" class="progress-text"></p>
      <progress id="progress-bar" max="100" value="0"></progress>
      <p id="notice" class="notice" hidden></p>
    </section>

    <section id="error" class="error" hidden role="alert">
      <p id="error-text"></p>
      <button id="error-options" type="button" class="secondary" hidden>Open Options</button>
    </section>

    <section id="result" class="result" hidden>
      <div id="summary" class="summary"></div>
      <p id="stats" class="stats"></p>
    </section>
  </main>

  <script type="module" src="popup.js"></script>
</body>
</html>
